<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gluecodium Calculator</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #eef4f1;
        color: #18312b;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef4f1, #d7e6df);
      }

      main {
        width: min(92vw, 30rem);
        padding: 2.5rem;
        border: 1px solid #c3d8cf;
        border-radius: 0.75rem;
        background: #fffdf8;
        box-shadow: 0 1.5rem 4rem rgb(24 49 43 / 14%);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1;
      }

      p {
        color: #526b63;
      }

      form {
        display: grid;
        gap: 1rem;
        margin-top: 2rem;
      }

      .inputs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }

      label {
        display: grid;
        gap: 0.4rem;
        font-weight: 650;
      }

      input,
      button {
        min-height: 2.75rem;
        box-sizing: border-box;
        border-radius: 0.4rem;
        font: inherit;
      }

      input {
        width: 100%;
        padding: 0 0.75rem;
        border: 1px solid #a9c4b8;
        background: #ffffff;
        color: inherit;
      }

      button {
        border: 0;
        background: #176b5b;
        color: #ffffff;
        cursor: pointer;
        font-weight: 700;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.55;
      }

      output {
        display: block;
        min-height: 2rem;
        margin-top: 1.5rem;
        padding: 1rem;
        border-left: 0.25rem solid #e39b35;
        background: #f7eee0;
        font-size: 1.25rem;
        font-weight: 700;
      }

      @media (max-width: 30rem) {
        main {
          padding: 1.5rem;
        }

        .inputs {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Calculator</h1>
      <p>Use the generated C++ <code>Calculator</code> class through embind and WebAssembly.</p>
      <form id="calculator-form">
        <div class="inputs">
          <label>
            First number
            <input id="first-number" name="first" type="number" value="20" required>
          </label>
          <label>
            Second number
            <input id="second-number" name="second" type="number" value="22" required>
          </label>
        </div>
        <button id="calculate" type="submit" disabled>Loading calculator...</button>
      </form>
      <output id="result" aria-live="polite">Loading the WebAssembly module...</output>
    </main>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
