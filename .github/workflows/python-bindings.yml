name: Python bindings

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-bindings-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  python-bindings:
    name: Python 3.14 / pybind11 3.1.0
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CC: gcc
      CXX: g++
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
      PYTHONDONTWRITEBYTECODE: '1'
      ORG_GRADLE_PROJECT_kotlinWarningsAsErrors: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            .github/requirements-python-ci.txt
            functional-tests/functional/python/pyproject.toml.in
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build ccache
      - name: Install Python test dependencies
        run: python -m pip install -r .github/requirements-python-ci.txt
      - name: Verify Python and pybind11 versions
        run: |
          python - <<'PY'
          import sys
          import sysconfig
          import pybind11
          assert sys.version_info[:2] == (3, 14), sys.version
          assert pybind11.__version__ == "3.1.0", pybind11.__version__
          print("Python:", sys.version)
          print("Interpreter:", sys.executable)
          print("SOABI:", sysconfig.get_config_var("SOABI"))
          print("pybind11:", pybind11.__version__)
          PY
      - name: Configure compiler cache directory
        run: echo "CCACHE_DIR=${RUNNER_TEMP}/ccache" >> "$GITHUB_ENV"
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ubuntu-24.04-gcc-python3.14-pybind3.1.0-ccache-v1-${{ hashFiles('gluecodium/src/main/**', 'lime-loader/**', 'lime-runtime/**', 'functional-tests/**', 'cmake/**', '.github/requirements-python-ci.txt') }}
          restore-keys: |
            ubuntu-24.04-gcc-python3.14-pybind3.1.0-ccache-v1-
      - name: Run generator smoke tests
        run: |
          chmod +x gradlew
          ./gradlew :gluecodium:test --tests com.here.gluecodium.SmokeTest --console=plain 2>&1 | tee python-smoke.log
      - name: Build and run Python functional tests
        run: |
          functional-tests/scripts/build-python-functional --buildGluecodium --python "$(command -v python)" --verbose 2>&1 | tee python-functional.log
      - name: Show compiler cache statistics
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          fi
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-3.14-failure-diagnostics
          retention-days: 14
          if-no-files-found: ignore
          path: |
            python-smoke.log
            python-functional.log
            gluecodium/build/reports/tests/test/
            gluecodium/build/test-results/test/
            functional-tests/build-python/cmake_output.log
            functional-tests/build-python/CMakeCache.txt
            functional-tests/build-python/CMakeFiles/CMakeConfigureLog.yaml
            functional-tests/build-python/Testing/Temporary/
